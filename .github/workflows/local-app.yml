name: Local learning app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate-curriculum.cjs
      - run: node --test local-app/tests/engine.test.cjs
